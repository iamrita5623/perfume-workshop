<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>專屬香氛調配工作台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Serif TC', serif; }
    .font-eng { font-family: 'Cinzel', serif; }

    /* 列印專屬強制顯色與版面保護 */
    @media print {
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      body {
        background-color: #ffffff !important;
        padding: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      #result-card {
        box-shadow: none !important;
        border: 1px solid #e5e5e5 !important;
        padding: 24px !important;
      }
    }
  </style>
</head>
<body class="bg-stone-100 text-stone-800 min-h-screen py-6 px-3 sm:px-6">

  <div class="max-w-xl mx-auto">
    
    <!-- 介面 1：現場調配工作台 -->
    <div id="workshop-panel" class="bg-white rounded-2xl shadow-sm border border-stone-200 p-5 sm:p-8">
      
      <!-- 標題 -->
      <div class="text-center mb-6 border-b border-stone-100 pb-5">
        <h2 class="text-xs tracking-widest uppercase text-stone-400 font-eng">Custom Fragrance Studio</h2>
        <h1 class="text-xl sm:text-2xl font-bold text-stone-800 mt-1">專屬調香工作台</h1>
        <p class="text-xs text-stone-500 mt-1">依瓶器重量上限秤取香材與基底，系統即時提示香氣結構</p>
      </div>

      <!-- 基本設定：前三個欄位必填 -->
      <div class="space-y-3 mb-6">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-stone-700 mb-1">
              調配師姓名 <span class="text-red-500">*</span>
            </label>
            <input type="text" id="cust-name" placeholder="請輸入姓名" class="w-full text-sm px-3 py-2 border border-stone-200 rounded-lg focus:outline-none focus:border-stone-500 transition">
          </div>
          <div>
            <label class="block text-xs font-semibold text-stone-700 mb-1">
              聯絡電話 <span class="text-red-500">*</span>
            </label>
            <input type="tel" inputmode="tel" id="cust-phone" placeholder="09xxxxxxxx" class="w-full text-sm px-3 py-2 border border-stone-200 rounded-lg focus:outline-none focus:border-stone-500 transition">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-stone-700 mb-1">
            為這款香水命名 <span class="text-red-500">*</span>
          </label>
          <input type="text" id="perfume-name" placeholder="例如：Lazy Sunday Morning" class="w-full text-sm px-3 py-2 border border-stone-200 rounded-lg focus:outline-none focus:border-stone-500 transition">
        </div>
      </div>

      <!-- 規格與自訂濃度設定 -->
      <div class="grid grid-cols-1 gap-4 mb-6 bg-stone-50 p-4 rounded-xl border border-stone-200">
        <!-- 瓶器選擇 (10mL, 30mL, 50mL, 自行輸入克數) -->
        <div>
          <label class="block text-xs font-semibold text-stone-600 mb-1.5">1. 選擇瓶器規格 (總重上限)</label>
          <div class="grid grid-cols-3 gap-2 mb-2">
            <button type="button" onclick="setBottle(9.0, '10mL')" id="btn-bottle-10" class="bottle-btn border border-stone-300 bg-white text-stone-700 text-xs py-2 rounded-lg font-medium transition">
              10 mL (9g)
            </button>
            <button type="button" onclick="setBottle(25.5, '30mL')" id="btn-bottle-30" class="bottle-btn border border-stone-800 bg-stone-800 text-white text-xs py-2 rounded-lg font-medium transition">
              30 mL (25.5g)
            </button>
            <button type="button" onclick="setBottle(42.5, '50mL')" id="btn-bottle-50" class="bottle-btn border border-stone-300 bg-white text-stone-700 text-xs py-2 rounded-lg font-medium transition">
              50 mL (42.5g)
            </button>
          </div>
          <!-- 自行輸入克數 (只能填g) -->
          <div class="flex items-center gap-2">
            <button type="button" onclick="setCustomBottleMode()" id="btn-bottle-custom" class="bottle-btn border border-stone-300 bg-white text-stone-700 text-xs px-3 py-2 rounded-lg font-medium whitespace-nowrap transition">
              ✏️ 自行輸入規格
            </button>
            <div id="custom-bottle-wrap" class="hidden flex-1 relative">
              <input type="number" inputmode="decimal" id="cust-bottle-weight" min="1" step="0.1" placeholder="請填寫瓶器總重上限 (g)" class="w-full bg-white border border-stone-300 rounded-lg px-3 py-1.5 text-xs font-mono text-right pr-8 focus:outline-none focus:border-stone-500" oninput="onCustomBottleInput()">
              <span class="absolute right-2.5 top-1.5 text-xs text-stone-400 font-bold">g</span>
            </div>
          </div>
        </div>

        <!-- 自填賦香率 (%) -->
        <div>
          <label class="block text-xs font-semibold text-stone-600 mb-1.5">
            2. 目標賦香率 (%) <span class="text-red-500">*</span>
          </label>
          <div class="flex items-center gap-2">
            <div class="relative flex-1">
              <input type="number" inputmode="decimal" id="cust-conc-rate" value="15" min="1" max="100" step="0.5" placeholder="填寫 %" class="w-full bg-white border border-stone-200 rounded-lg px-3 py-1.5 text-sm font-mono text-right pr-7 focus:outline-none focus:border-stone-500" oninput="calculateAll()">
              <span class="absolute right-2.5 top-2 text-xs text-stone-400 font-bold">%</span>
            </div>
            <div class="flex gap-1 text-[11px]">
              <button type="button" onclick="quickSetConc(12)" class="px-2 py-1.5 bg-white border border-stone-200 rounded hover:bg-stone-100 text-stone-600">12%</button>
              <button type="button" onclick="quickSetConc(15)" class="px-2 py-1.5 bg-white border border-stone-200 rounded hover:bg-stone-100 text-stone-600">15%</button>
              <button type="button" onclick="quickSetConc(20)" class="px-2 py-1.5 bg-white border border-stone-200 rounded hover:bg-stone-100 text-stone-600">20%</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 即時核心指引看板 -->
      <div class="bg-stone-50 rounded-xl p-4 mb-6 border border-stone-200">
        <div class="flex justify-between items-center text-xs text-stone-500 mb-2">
          <span>香調層次分佈</span>
          <span id="note-summary">前 0% ｜ 中 0% ｜ 後 0%</span>
        </div>
        
        <!-- 彩色比例條 -->
        <div class="h-2.5 w-full bg-stone-200 rounded-full overflow-hidden flex mb-4">
          <div id="bar-top" class="bg-emerald-400 transition-all duration-300" style="width: 0%"></div>
          <div id="bar-mid" class="bg-amber-400 transition-all duration-300" style="width: 0%"></div>
          <div id="bar-base" class="bg-orange-500 transition-all duration-300" style="width: 0%"></div>
        </div>

        <div class="grid grid-cols-3 gap-2 text-center pt-2 border-t border-stone-200">
          <div>
            <div class="text-[11px] text-stone-500">目標香材總量</div>
            <div id="target-frag-weight" class="text-base font-bold text-stone-700">3.83 <span class="text-xs font-normal">g</span></div>
          </div>
          <div>
            <div class="text-[11px] text-stone-500">已秤入香材重</div>
            <div id="total-frag-weight" class="text-base font-bold text-stone-800">0.00 <span class="text-xs font-normal">g</span></div>
          </div>
          <div>
            <div class="text-[11px] text-stone-500">需補足香水基底</div>
            <div id="remain-base-weight" class="text-base font-bold text-indigo-900">25.50 <span class="text-xs font-normal">g</span></div>
          </div>
        </div>

        <div id="status-alert-box" class="mt-3 pt-2 border-t border-stone-200 text-xs text-center font-medium">
        </div>
      </div>

      <!-- 香材清單輸入區 -->
      <div class="mb-6">
        <div class="flex justify-between items-center mb-3">
          <label class="text-sm font-semibold text-stone-700">調配香材明細</label>
          <button type="button" onclick="addMaterialRow()" class="text-xs bg-stone-100 hover:bg-stone-200 text-stone-700 px-3 py-1.5 rounded-lg border border-stone-300 transition">
            + 增加香材
          </button>
        </div>
        
        <div id="materials-container" class="space-y-3">
          <!-- 動態香材列插入位置 -->
        </div>
      </div>

      <!-- 確認按鈕 -->
      <button type="button" id="btn-submit" onclick="finalizeFormula()" class="w-full bg-stone-800 hover:bg-black text-white text-sm py-3.5 rounded-xl font-medium tracking-wide transition shadow">
        確認調配完成並生成配方卡
      </button>

    </div>

    <!-- 介面 2：成果配方證書卡 (真正的向量三角香調金字塔) -->
    <div id="result-card" class="hidden bg-white rounded-2xl shadow-xl border border-stone-200 p-6 sm:p-8 text-center relative overflow-hidden">
      <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-emerald-400 via-amber-400 to-orange-500"></div>

      <div class="py-3">
        <h3 class="text-xs tracking-widest text-stone-400 uppercase font-eng">Certificate of Custom Fragrance</h3>
        <h1 id="cert-perfume-name" class="text-2xl font-bold text-stone-800 mt-2 font-eng">Custom Perfume</h1>
        <p class="text-xs text-stone-500 mt-1">專屬調配師：<span id="cert-creator" class="font-medium text-stone-700"></span></p>
      </div>

      <!-- 真正的三角香調嗅覺金字塔 (SVG 向量金字塔) -->
      <div class="bg-stone-50 rounded-xl p-5 my-5 border border-stone-100">
        <div class="text-xs font-semibold text-stone-600 mb-3 text-center tracking-widest uppercase font-eng">
          Fragrance Olfactory Pyramid
        </div>
        
        <div class="relative w-full max-w-[340px] mx-auto py-2">
          <svg viewBox="0 0 320 220" class="w-full h-auto drop-shadow-sm overflow-visible">
            <!-- 頂層三角形 (Top Notes) -->
            <polygon points="160,10 115,75 205,75" fill="#a7f3d0" stroke="#059669" stroke-width="1.5" stroke-linejoin="round" />
            <!-- 中層梯形 (Heart Notes) -->
            <polygon points="112,80 208,80 252,145 68,145" fill="#fde68a" stroke="#d97706" stroke-width="1.5" stroke-linejoin="round" />
            <!-- 底層梯形 (Base Notes) -->
            <polygon points="65,150 255,150 298,215 22,215" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5" stroke-linejoin="round" />

            <!-- 頂層文字 -->
            <text x="160" y="45" text-anchor="middle" font-family="'Cinzel', serif" font-size="11" font-weight="bold" fill="#065f46">TOP NOTES</text>
            <text id="svg-top-pct" x="160" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#064e3b">0%</text>

            <!-- 中層文字 -->
            <text x="160" y="105" text-anchor="middle" font-family="'Cinzel', serif" font-size="11" font-weight="bold" fill="#92400e">HEART / MIDDLE</text>
            <text id="svg-mid-pct" x="160" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">0%</text>

            <!-- 底層文字 -->
            <text x="160" y="176" text-anchor="middle" font-family="'Cinzel', serif" font-size="11" font-weight="bold" fill="#9a3412">BASE NOTES</text>
            <text id="svg-base-pct" x="160" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#7c2d12">0%</text>
          </svg>

          <!-- 金字塔各層香材標註 -->
          <div class="mt-4 space-y-2 text-left text-xs border-t border-stone-200/60 pt-3">
            <div class="flex items-start gap-2">
              <span class="inline-block px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800 text-[10px] font-bold font-eng whitespace-nowrap mt-0.5">TOP</span>
              <span id="pyramid-top-items" class="text-stone-600 leading-relaxed break-words flex-1">無特定前調</span>
            </div>
            <div class="flex items-start gap-2">
              <span class="inline-block px-1.5 py-0.5 rounded bg-amber-100 text-amber-800 text-[10px] font-bold font-eng whitespace-nowrap mt-0.5">MID</span>
              <span id="pyramid-mid-items" class="text-stone-600 leading-relaxed break-words flex-1">無特定中調</span>
            </div>
            <div class="flex items-start gap-2">
              <span class="inline-block px-1.5 py-0.5 rounded bg-orange-100 text-orange-800 text-[10px] font-bold font-eng whitespace-nowrap mt-0.5">BASE</span>
              <span id="pyramid-base-items" class="text-stone-600 leading-relaxed break-words flex-1">無特定後調</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 香材投入比例清單 (左側自動折行，右側固定寬度不折行) -->
      <div class="text-left mb-6">
        <div class="text-xs font-semibold text-stone-600 mb-2">精選調配成分</div>
        <ul id="cert-materials-list" class="divide-y divide-stone-100 text-xs">
        </ul>
      </div>

      <!-- 底部規格資訊：規格：XXmL / XXg (賦香率 XX.X%) -->
      <div class="border-t border-stone-100 pt-4 text-xs text-stone-500 flex justify-between items-center">
        <span>規格：<span id="cert-volume" class="font-semibold text-stone-700">30mL</span> (<span class="text-stone-600">賦香率 </span><span id="cert-actual-conc" class="text-indigo-950 font-bold">15.0%</span>)</span>
        <span id="cert-date">2026.10.31</span>
      </div>

      <!-- 操作按鈕 (列印時自動隱藏) -->
      <div class="mt-6 flex gap-3 no-print">
        <button onclick="window.print()" class="flex-1 border border-stone-300 hover:bg-stone-50 text-stone-700 text-xs py-2.5 rounded-lg transition">
          列印 / 存為 PDF 證書
        </button>
        <button onclick="editFormulaAgain()" class="flex-1 bg-stone-800 hover:bg-black text-white text-xs py-2.5 rounded-lg transition">
          返回微調配方
        </button>
      </div>

    </div>

  </div>

  <script>
    // 完整 884 款香材清單 (代碼, 英文名稱, 香調) - 純英文
    const MATERIALS_DB = [...]; // 內建完整884筆清單

    let isCustomBottle = false;
    let bottleLimitWeight = 25.5; // 預設 30mL = 25.5g
    let bottleName = "30mL";
    let rowSequence = 0; // 嚴格獨立的唯一計數器，徹底防止欄位互相干擾

    function setBottle(weight, name) {
      isCustomBottle = false;
      bottleLimitWeight = weight;
      bottleName = name;

      document.getElementById('custom-bottle-wrap').classList.add('hidden');

      document.querySelectorAll('.bottle-btn').forEach(btn => {
        btn.classList.remove('bg-stone-800', 'text-white', 'border-stone-800');
        btn.classList.add('bg-white', 'text-stone-700', 'border-stone-300');
      });

      let activeId = 'btn-bottle-30';
      if (name === '10mL') activeId = 'btn-bottle-10';
      if (name === '50mL') activeId = 'btn-bottle-50';

      const activeBtn = document.getElementById(activeId);
      if (activeBtn) {
        activeBtn.classList.remove('bg-white', 'text-stone-700', 'border-stone-300');
        activeBtn.classList.add('bg-stone-800', 'text-white', 'border-stone-800');
      }

      calculateAll();
    }

    function setCustomBottleMode() {
      isCustomBottle = true;
      document.getElementById('custom-bottle-wrap').classList.remove('hidden');

      document.querySelectorAll('.bottle-btn').forEach(btn => {
        btn.classList.remove('bg-stone-800', 'text-white', 'border-stone-800');
        btn.classList.add('bg-white', 'text-stone-700', 'border-stone-300');
      });

      const customBtn = document.getElementById('btn-bottle-custom');
      customBtn.classList.remove('bg-white', 'text-stone-700', 'border-stone-300');
      customBtn.classList.add('bg-stone-800', 'text-white', 'border-stone-800');

      const input = document.getElementById('cust-bottle-weight');
      input.focus();
      onCustomBottleInput();
    }

    function onCustomBottleInput() {
      if (!isCustomBottle) return;
      const val = parseFloat(document.getElementById('cust-bottle-weight').value);
      if (val && val > 0) {
        bottleLimitWeight = val;
        bottleName = val + "g";
      } else {
        bottleLimitWeight = 0;
        bottleName = "自訂克數";
      }
      calculateAll();
    }

    function quickSetConc(val) {
      document.getElementById('cust-conc-rate').value = val;
      calculateAll();
    }

    // 新增香材列：採用全局累加 sequence，確保每一列 ID 絕對唯一！
    function addMaterialRow() {
      rowSequence++;
      const container = document.getElementById('materials-container');
      const rowId = 'mat-row-' + rowSequence;

      const row = document.createElement('div');
      row.id = rowId;
      row.className = "bg-stone-50 p-3 rounded-xl border border-stone-200 transition relative";
      row.innerHTML = `
        <div class="mb-2 relative">
          <input type="hidden" class="mat-code" value="">
          <input type="hidden" class="mat-note" value="">
          <input type="hidden" class="mat-name" value="">
          
          <input type="text" 
                 placeholder="🔍 輸入中文(如 薰衣草)、英文或代碼..." 
                 class="mat-search-input w-full bg-white border border-stone-200 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-stone-500 font-mono transition"
                 oninput="filterMaterials(this, '${rowId}')"
                 onfocus="openDropdown('${rowId}')">
          
          <div id="dropdown-${rowId}" class="mat-dropdown hidden absolute left-0 right-0 top-full mt-1 max-h-48 overflow-y-auto bg-white border border-stone-300 rounded-lg shadow-lg z-30 text-xs">
          </div>
          
          <div id="unselected-warn-${rowId}" class="hidden text-[11px] text-amber-700 mt-1 font-medium">
            ⚠️ 尚未從下拉清單選定香材，請點擊搜尋結果完成選取
          </div>
        </div>

        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-1">
            <span class="text-xs text-stone-500 font-medium">秤入重量：</span>
            <input type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" class="mat-weight w-24 bg-white border border-stone-200 rounded-lg px-2 py-1.5 text-xs text-right focus:outline-none font-mono" oninput="calculateAll()">
            <span class="text-xs text-stone-500 font-bold">g</span>
          </div>
          <button type="button" onclick="removeRow('${rowId}')" class="text-xs text-stone-400 hover:text-red-500 px-2 py-1 border border-stone-200 rounded bg-white transition">刪除</button>
        </div>
      `;
      container.appendChild(row);
    }

    function filterMaterials(input, rowId) {
      const keyword = input.value.trim().toLowerCase();
      const dropdown = document.getElementById('dropdown-' + rowId);
      const row = document.getElementById(rowId);
      const warnEl = document.getElementById('unselected-warn-' + rowId);

      row.querySelector('.mat-code').value = '';
      row.querySelector('.mat-name').value = '';
      row.querySelector('.mat-note').value = '';
      input.classList.remove('border-emerald-500', 'bg-emerald-50/20');
      calculateAll();

      dropdown.innerHTML = '';

      if (!keyword) {
        dropdown.classList.add('hidden');
        if (warnEl) warnEl.classList.add('hidden');
        input.classList.remove('border-amber-400');
        return;
      }

      if (warnEl) warnEl.classList.remove('hidden');
      input.classList.add('border-amber-400');

      const matched = MATERIALS_DB.filter(item => 
        item.code.toLowerCase().includes(keyword) || 
        item.name.toLowerCase().includes(keyword) ||
        (item.zh && item.zh.includes(keyword))
      ).slice(0, 25);

      if (matched.length === 0) {
        dropdown.innerHTML = '<div class="p-2 text-stone-400 text-center">找不到相符香材 (支援中英文與代碼)</div>';
      } else {
        matched.forEach(item => {
          const div = document.createElement('div');
          div.className = "px-3 py-2 hover:bg-stone-100 cursor-pointer border-b border-stone-100 last:border-b-0 flex justify-between items-center";
          div.innerHTML = `
            <div>
              <span class="font-medium text-stone-700">${item.code} | ${item.name}</span>
              <span class="text-stone-400 text-[11px] block sm:inline sm:ml-1">(${item.zh})</span>
            </div>
            <span class="text-[10px] px-1.5 py-0.5 rounded bg-stone-200 text-stone-600 font-eng whitespace-nowrap ml-2">${item.note}</span>
          `;
          div.onclick = function() {
            selectMaterial(rowId, item);
          };
          dropdown.appendChild(div);
        });
      }
      dropdown.classList.remove('hidden');
    }

    function openDropdown(rowId) {
      const input = document.querySelector('#' + rowId + ' .mat-search-input');
      if (input.value.trim() && !document.querySelector('#' + rowId + ' .mat-code').value) {
        filterMaterials(input, rowId);
      }
    }

    function selectMaterial(rowId, item) {
      const row = document.getElementById(rowId);
      row.querySelector('.mat-code').value = item.code;
      row.querySelector('.mat-name').value = item.name;
      row.querySelector('.mat-note').value = item.note;
      
      const input = row.querySelector('.mat-search-input');
      input.value = `${item.code} | ${item.name} [${item.note}]`;
      
      input.classList.remove('border-amber-400');
      input.classList.add('border-emerald-500', 'bg-emerald-50/20');

      const warnEl = document.getElementById('unselected-warn-' + rowId);
      if (warnEl) warnEl.classList.add('hidden');
      
      document.getElementById('dropdown-' + rowId).classList.add('hidden');
      calculateAll();
    }

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.mat-search-input') && !e.target.closest('.mat-dropdown')) {
        document.querySelectorAll('.mat-dropdown').forEach(d => d.classList.add('hidden'));
      }
    });

    function removeRow(rowId) {
      const el = document.getElementById(rowId);
      if (el) el.remove();
      calculateAll();
    }

    function calculateAll() {
      let totalFragWeight = 0;
      let topWeight = 0;
      let midWeight = 0;
      let baseWeight = 0;

      const rows = document.querySelectorAll('#materials-container > div');
      rows.forEach(r => {
        const code = r.querySelector('.mat-code').value;
        const note = r.querySelector('.mat-note').value;
        const weightInput = r.querySelector('.mat-weight');
        const weight = parseFloat(weightInput.value) || 0;

        if (code && weight > 0) {
          totalFragWeight += weight;
          if (note === 'Top') topWeight += weight;
          if (note === 'Mid') midWeight += weight;
          if (note === 'Base') baseWeight += weight;
        }
      });

      const concInputRaw = document.getElementById('cust-conc-rate').value.trim();
      const targetConcInput = parseFloat(concInputRaw);
      const isConcValid = !isNaN(targetConcInput) && targetConcInput > 0;

      const targetFragEl = document.getElementById('target-frag-weight');
      const baseEl = document.getElementById('remain-base-weight');
      const alertBox = document.getElementById('status-alert-box');
      const submitBtn = document.getElementById('btn-submit');

      document.getElementById('total-frag-weight').innerHTML = `${totalFragWeight.toFixed(2)} <span class="text-xs font-normal">g</span>`;

      if (isCustomBottle && bottleLimitWeight <= 0) {
        targetFragEl.innerHTML = `<span class="text-stone-400 font-normal">--</span>`;
        baseEl.innerHTML = `<span class="text-amber-600 font-bold">待填瓶重</span>`;
        alertBox.innerHTML = `<span class="text-amber-700">⚠️ 請在上方填寫自行輸入的「瓶器總重上限 (g)」。</span>`;
        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
        return { totalFragWeight: 0, remainBase: 0, topPct: 0, midPct: 0, basePct: 0, actualConc: 0 };
      }

      if (!isConcValid) {
        targetFragEl.innerHTML = `<span class="text-amber-600 font-bold">待填%</span>`;
        baseEl.innerHTML = `<span class="text-stone-400 font-normal">--</span>`;
        alertBox.innerHTML = `<span class="text-amber-700">⚠️ 請在上方輸入「目標賦香率 (%)」。</span>`;
        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
        return { totalFragWeight: 0, remainBase: 0, topPct: 0, midPct: 0, basePct: 0, actualConc: 0 };
      }

      const targetConcRate = targetConcInput / 100;
      const targetFragWeight = bottleLimitWeight * targetConcRate;
      targetFragEl.innerHTML = `${targetFragWeight.toFixed(2)} <span class="text-xs font-normal">g</span>`;

      const remainBase = bottleLimitWeight - totalFragWeight;

      if (remainBase < 0) {
        baseEl.innerHTML = `<span class="text-red-600 font-bold">已破瓶容</span>`;
        alertBox.innerHTML = `<span class="text-red-600">🔴 香材投入重 (${totalFragWeight.toFixed(2)}g) 已超出瓶器極限 (${bottleLimitWeight}g)！請倒出過量香材。</span>`;
        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
      } else {
        baseEl.innerHTML = `${remainBase.toFixed(2)} <span class="text-xs font-normal">g</span>`;
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');

        const actualConcPct = bottleLimitWeight > 0 ? ((totalFragWeight / bottleLimitWeight) * 100) : 0;
        const diffWeight = totalFragWeight - targetFragWeight;

        if (totalFragWeight === 0) {
          alertBox.innerHTML = `<span class="text-stone-400">⚪ 等待加入香材... 目標加入約 ${targetFragWeight.toFixed(2)}g</span>`;
        } else if (diffWeight > 0.01) {
          alertBox.innerHTML = `
            <div class="text-amber-700 bg-amber-50 py-1.5 px-3 rounded-lg border border-amber-200">
              ⚠️ <strong>香材已超出原目標 (+${diffWeight.toFixed(2)}g)</strong><br>
              補滿基底 (${remainBase.toFixed(2)}g) 後，實際賦香率為 <strong class="text-amber-900">${actualConcPct.toFixed(1)}%</strong>
            </div>`;
        } else if (diffWeight < -0.01) {
          const needMore = Math.abs(diffWeight);
          alertBox.innerHTML = `<span class="text-stone-600">🟡 距離目標香材量 (${targetFragWeight.toFixed(2)}g) 還差 <strong class="text-indigo-900 font-bold font-mono">${needMore.toFixed(2)}g</strong> 香材</span>`;
        } else {
          alertBox.innerHTML = `<span class="text-emerald-600 font-bold">🟢 已精準達到目標香材量 (${targetFragWeight.toFixed(2)}g)！請補足基底 ${remainBase.toFixed(2)}g 至瓶口。</span>`;
        }
      }

      let topPct = 0, midPct = 0, basePct = 0;
      if (totalFragWeight > 0) {
        topPct = Math.round((topWeight / totalFragWeight) * 100);
        midPct = Math.round((midWeight / totalFragWeight) * 100);
        basePct = Math.max(0, 100 - topPct - midPct);
      }

      document.getElementById('bar-top').style.width = topPct + '%';
      document.getElementById('bar-mid').style.width = midPct + '%';
      document.getElementById('bar-base').style.width = basePct + '%';
      document.getElementById('note-summary').innerText = `前 ${topPct}% ｜ 中 ${midPct}% ｜ 後 ${basePct}%`;

      const actualConc = bottleLimitWeight > 0 ? ((totalFragWeight / bottleLimitWeight) * 100) : 0;
      return { totalFragWeight, remainBase, topPct, midPct, basePct, actualConc };
    }

    function finalizeFormula() {
      const name = document.getElementById('cust-name').value.trim();
      const phone = document.getElementById('cust-phone').value.trim();
      const pName = document.getElementById('perfume-name').value.trim();

      if (!name) {
        alert("請輸入【調配師姓名】！");
        document.getElementById('cust-name').focus();
        return;
      }
      if (!phone) {
        alert("請輸入【聯絡電話】！");
        document.getElementById('cust-phone').focus();
        return;
      }
      if (!pName) {
        alert("請為這款香水【命名】！");
        document.getElementById('perfume-name').focus();
        return;
      }

      if (isCustomBottle && bottleLimitWeight <= 0) {
        alert("請填寫自行輸入的【瓶器總重上限 (g)】！");
        document.getElementById('cust-bottle-weight').focus();
        return;
      }

      const concInputRaw = document.getElementById('cust-conc-rate').value.trim();
      const targetConcInput = parseFloat(concInputRaw);
      if (isNaN(targetConcInput) || targetConcInput <= 0) {
        alert("請填寫【目標賦香率 (%)】！");
        document.getElementById('cust-conc-rate').focus();
        return;
      }

      const rows = document.querySelectorAll('#materials-container > div');
      
      for (let i = 0; i < rows.length; i++) {
        const r = rows[i];
        const searchInput = r.querySelector('.mat-search-input');
        const textVal = searchInput.value.trim();
        const codeVal = r.querySelector('.mat-code').value;
        const weightInput = r.querySelector('.mat-weight');
        const weight = parseFloat(weightInput.value) || 0;

        if (textVal !== '' && !codeVal) {
          alert(`⚠️ 第 ${i + 1} 列【${textVal}】尚未從清單選取有效香材！\n請點擊輸入框下方的搜尋結果完成選取，或清空該列。`);
          searchInput.focus();
          return;
        }

        if (codeVal && weight <= 0) {
          const nameVal = r.querySelector('.mat-name').value;
          alert(`⚠️ 第 ${i + 1} 列已挑選香材【${codeVal} ${nameVal}】，但尚未填寫秤入重量！\n請填寫克數或點擊右側「刪除」該列。`);
          weightInput.focus();
          return;
        }
      }

      const { totalFragWeight, remainBase, topPct, midPct, basePct, actualConc } = calculateAll();
      
      if (totalFragWeight === 0) {
        alert("請先至少加入一種香材並填寫磅秤克數！");
        return;
      }
      if (remainBase < 0) {
        alert("香材投入重量已超出瓶器容量極限，無法完成調配！");
        return;
      }

      document.getElementById('cert-creator').innerText = name;
      document.getElementById('cert-perfume-name').innerText = pName;
      document.getElementById('cert-volume').innerText = bottleName;
      document.getElementById('cert-actual-conc').innerText = actualConc.toFixed(1) + "%";
      
      const now = new Date();
      document.getElementById('cert-date').innerText = `${now.getFullYear()}.${now.getMonth()+1}.${now.getDate()}`;

      document.getElementById('svg-top-pct').textContent = topPct + "%";
      document.getElementById('svg-mid-pct').textContent = midPct + "%";
      document.getElementById('svg-base-pct').textContent = basePct + "%";

      const topNames = [];
      const midNames = [];
      const baseNames = [];

      const listContainer = document.getElementById('cert-materials-list');
      listContainer.innerHTML = '';
      
      rows.forEach(r => {
        const code = r.querySelector('.mat-code').value;
        const nameVal = r.querySelector('.mat-name').value;
        const note = r.querySelector('.mat-note').value;
        const weight = parseFloat(r.querySelector('.mat-weight').value) || 0;

        if (code && weight > 0) {
          const ratio = Math.round((weight / totalFragWeight) * 100);
          
          if (note === 'Top') topNames.push(nameVal);
          if (note === 'Mid') midNames.push(nameVal);
          if (note === 'Base') baseNames.push(nameVal);

          const li = document.createElement('li');
          li.className = "py-2.5 flex items-start justify-between gap-3 border-b border-stone-100 last:border-b-0";
          li.innerHTML = `
            <div class="flex-1 pr-2 break-words text-stone-700 font-medium leading-snug">
              ${code} | ${nameVal} <span class="text-stone-400 font-normal">[${note}]</span>
            </div>
            <div class="w-28 text-right font-mono flex-shrink-0 whitespace-nowrap text-stone-500 text-xs pt-0.5">
              ${weight.toFixed(2)}g <span class="text-stone-400">(${ratio}%)</span>
            </div>
          `;
          listContainer.appendChild(li);
        }
      });

      document.getElementById('pyramid-top-items').innerText = topNames.length > 0 ? topNames.join(', ') : '無特定前調';
      document.getElementById('pyramid-mid-items').innerText = midNames.length > 0 ? midNames.join(', ') : '無特定中調';
      document.getElementById('pyramid-base-items').innerText = baseNames.length > 0 ? baseNames.join(', ') : '無特定後調';

      document.getElementById('workshop-panel').classList.add('hidden');
      document.getElementById('result-card').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function editFormulaAgain() {
      document.getElementById('result-card').classList.add('hidden');
      document.getElementById('workshop-panel').classList.remove('hidden');
    }

    window.onload = function() {
      addMaterialRow();
      addMaterialRow();
      calculateAll();
    };
  </script>
</body>
</html>
